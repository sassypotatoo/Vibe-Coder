name: Node Android downloadable runtime

on:
  workflow_dispatch:
  push:
    paths:
      - "android/node_runtime/**"
      - "scripts/stage_node_runtime_split.py"
      - "scripts/verify_node_runtime_split_apk.py"
      - "scripts/package_node_runtime_release.sh"
      - "scripts/part34_node_execute_cross_build.sh"
      - "scripts/verify_node_cross_build_evidence.py"
      - "scripts/test_part34_10_17_node_404_recovery.py"
      - ".github/workflows/node-runtime-proof.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: node-runtime-download-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_PLATFORM: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK_VERSION: "28.2.13676358"
  ANDROID_CMAKE_VERSION: "3.22.1"
  VIBECODER_ANDROID_API: "29"
  NODE_RUNTIME_TAG: "vibecoder-node-runtime-24.19.0-v31"
  NODE_RUNTIME_ASSET: "vibecoder-node-runtime-arm64-v31.apk"

jobs:
  node-runtime-release:
    name: Ensure downloadable Node 24.19.0 runtime exists
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Check fixed downloadable runtime release
        id: runtime_release
        shell: bash
        run: |
          set -euo pipefail
          exists=false
          RUNTIME_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${NODE_RUNTIME_TAG}/${NODE_RUNTIME_ASSET}"
          RELEASE_JSON="$(gh release view "$NODE_RUNTIME_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets 2>/dev/null || true)"
          if [[ -n "$RELEASE_JSON" ]]; then
            is_draft="$(jq -r '.isDraft' <<<"$RELEASE_JSON")"
            is_prerelease="$(jq -r '.isPrerelease' <<<"$RELEASE_JSON")"
            has_asset="$(jq --arg asset "$NODE_RUNTIME_ASSET" \
              '[.assets[].name == $asset] | any' <<<"$RELEASE_JSON")"
            if [[ "$has_asset" == "true" && ( "$is_draft" == "true" || "$is_prerelease" == "true" ) ]]; then
              echo "Runtime asset exists on a non-public release; publishing the fixed tag before reuse."
              gh release edit "$NODE_RUNTIME_TAG" --repo "$GITHUB_REPOSITORY" \
                --draft=false --prerelease=false
              is_draft=false
              is_prerelease=false
            fi
            if [[ "$has_asset" == "true" && "$is_draft" == "false" && "$is_prerelease" == "false" ]]; then
              if curl --fail --location --silent --show-error --head \
                  --retry 3 --retry-delay 5 --retry-all-errors \
                  --connect-timeout 15 --max-time 60 "$RUNTIME_URL" >/dev/null; then
                exists=true
              else
                echo "Runtime asset is listed but its public download URL is not usable; rebuilding/publishing it."
              fi
            fi
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "Node runtime public release already usable: $exists"

      - uses: actions/setup-java@v5.6.0
        if: steps.runtime_release.outputs.exists != 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4.0.1
        if: steps.runtime_release.outputs.exists != 'true'
        with:
          cmdline-tools-version: "15859902"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Android packages
        if: steps.runtime_release.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

      - uses: dtolnay/rust-toolchain@1.88.0
        if: steps.runtime_release.outputs.exists != 'true'
        with:
          targets: aarch64-linux-android

      - uses: gradle/actions/setup-gradle@v6.2.0
        if: steps.runtime_release.outputs.exists != 'true'
        with:
          gradle-version: "9.5.0"
          cache-provider: basic

      - name: Fail-fast source and direct-download contract validation
        if: steps.runtime_release.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_checkpoint.py
          python3 scripts/validate_part34_10.py
          python3 scripts/test_part34_10_compile_repairs.py
          python3 scripts/test_part34_10_15_node_delivery.py
          python3 scripts/test_part34_10_17_node_404_recovery.py

      - name: Cross-compile exact Node source for Android Bionic once
        if: steps.runtime_release.outputs.exists != 'true'
        shell: bash
        run: |
          export ANDROID_NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          export VIBECODER_BUILD_JOBS="4"
          bash scripts/part34_node_execute_cross_build.sh

      - name: Verify proven Node candidate
        if: steps.runtime_release.outputs.exists != 'true'
        shell: bash
        run: |
          python3 scripts/verify_android_elf.py \
            android/app/build/generated/jniLibs/arm64-v8a/libvibecoder_node_exec.so >/dev/null
          python3 scripts/verify_node_cross_build_evidence.py \
            android/app/build/generated/jniLibs/arm64-v8a/libvibecoder_node_exec.so \
            android/app/build/outputs/vibecoder-part34-node-cross-build-evidence.json

      - name: Package signed downloadable Node runtime split
        if: steps.runtime_release.outputs.exists != 'true'
        shell: bash
        run: |
          export ANDROID_NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          bash scripts/package_node_runtime_release.sh \
            android/app/build/generated/jniLibs/arm64-v8a/libvibecoder_node_exec.so \
            android/app/build/outputs/vibecoder-part34-node-cross-build-evidence.json

      - name: Publish fixed Node runtime release
        if: steps.runtime_release.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="android/node_runtime/build/outputs/runtime-package/$NODE_RUNTIME_ASSET"
          HASH="$APK.sha256"
          test -s "$APK"
          test -s "$HASH"
          if gh release view "$NODE_RUNTIME_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$NODE_RUNTIME_TAG" "$APK" "$HASH" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$NODE_RUNTIME_TAG" --repo "$GITHUB_REPOSITORY" \
              --draft=false --prerelease=false
          else
            gh release create "$NODE_RUNTIME_TAG" "$APK" "$HASH" \
              --repo "$GITHUB_REPOSITORY" \
              --title "VibeCoder Node.js Android Runtime 24.19.0" \
              --notes "Development runtime downloaded by VibeCoder first-run setup."
          fi

      - name: Verify published Node runtime download URL
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${NODE_RUNTIME_TAG}/${NODE_RUNTIME_ASSET}"
          HASH_URL="${RUNTIME_URL}.sha256"
          PROBE_DIR="${RUNNER_TEMP}/vibecoder-node-runtime-public-probe"
          rm -rf "$PROBE_DIR"
          mkdir -p "$PROBE_DIR"
          echo "Probing the exact first-run URL used by VibeCoder: $RUNTIME_URL"
          curl --fail --location --retry 8 --retry-delay 15 --retry-all-errors \
            --connect-timeout 20 --max-time 600 \
            --output "$PROBE_DIR/$NODE_RUNTIME_ASSET" "$RUNTIME_URL"
          curl --fail --location --retry 8 --retry-delay 15 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            --output "$PROBE_DIR/$NODE_RUNTIME_ASSET.sha256" "$HASH_URL"
          test -s "$PROBE_DIR/$NODE_RUNTIME_ASSET"
          test -s "$PROBE_DIR/$NODE_RUNTIME_ASSET.sha256"
          EXPECTED_SHA="$(awk 'NF {print $1; exit}' "$PROBE_DIR/$NODE_RUNTIME_ASSET.sha256")"
          ACTUAL_SHA="$(sha256sum "$PROBE_DIR/$NODE_RUNTIME_ASSET" | awk '{print $1}')"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{64}$ ]]
          [[ "${ACTUAL_SHA,,}" == "${EXPECTED_SHA,,}" ]]
          python3 - "$PROBE_DIR/$NODE_RUNTIME_ASSET" <<'PY'
          import json, sys, zipfile
          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              assert 'lib/arm64-v8a/libvibecoder_node_exec.so' in names, 'node payload missing'
              assert z.getinfo('lib/arm64-v8a/libvibecoder_node_exec.so').file_size > 0, 'node payload empty'
              manifest = json.loads(z.read('assets/node-runtime/manifest.json'))
          expected = {
              'component_id': 'node',
              'version': '24.19.0',
              'abi': 'arm64-v8a',
              'libc': 'bionic',
              'delivery': 'github_release_packageinstaller_split',
              'split': 'node_runtime',
              'release_tag': 'vibecoder-node-runtime-24.19.0-v31',
              'runtime_apk': 'vibecoder-node-runtime-arm64-v31.apk',
          }
          for key, value in expected.items():
              assert manifest.get(key) == value, f'manifest mismatch: {key}'
          print('Published Node runtime public URL verification PASSED')
          PY

      - name: Dispatch fresh Alpha after runtime is public
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          echo "Node runtime is public and verified; dispatching the Alpha workflow on ${GITHUB_REF_NAME}."
          gh workflow run android-diagnostic-apk.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME"

      - name: Upload reusable runtime package artifact
        if: steps.runtime_release.outputs.exists != 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: vibecoder-node-runtime-download-package
          path: |
            android/node_runtime/build/outputs/runtime-package/vibecoder-node-runtime-arm64-v31.apk
            android/node_runtime/build/outputs/runtime-package/vibecoder-node-runtime-arm64-v31.apk.sha256
            android/app/build/outputs/vibecoder-part34-node-cross-build-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload Node build failure logs
        if: failure() && steps.runtime_release.outputs.exists != 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: vibecoder-node-runtime-download-failure
          path: android/app/build/outputs/vibecoder-part34-node-*.log
          if-no-files-found: warn
          retention-days: 30
