name: Node Android runtime proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-runtime-proof-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_PLATFORM: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK_VERSION: "28.2.13676358"
  ANDROID_CMAKE_VERSION: "3.22.1"
  VIBECODER_ANDROID_API: "29"

jobs:
  node-android-proof-build:
    name: Exact Node 24.19.0 Android cross-compile
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Fail-fast source and Node build-contract validation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_checkpoint.py
          python3 scripts/validate_part34_10.py
          python3 scripts/test_part34_10_compile_repairs.py
          python3 scripts/test_part34_10_15_node_delivery.py
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4.0.1
        with:
          cmdline-tools-version: "15859902"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE_VERSION}"
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android
      - name: Cross-compile exact Node source for Android Bionic
        shell: bash
        run: |
          export ANDROID_NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          export VIBECODER_BUILD_JOBS="4"
          bash scripts/part34_node_execute_cross_build.sh
      - name: Verify proven Node candidate
        shell: bash
        run: |
          python3 scripts/verify_android_elf.py android/app/build/generated/jniLibs/arm64-v8a/libvibecoder_node_exec.so >/dev/null
          python3 scripts/verify_node_cross_build_evidence.py android/app/build/generated/jniLibs/arm64-v8a/libvibecoder_node_exec.so android/app/build/outputs/vibecoder-part34-node-cross-build-evidence.json
      - name: Upload reusable Node runtime artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: vibecoder-node-24.19.0-android-arm64
          path: |
            android/app/build/generated/jniLibs/arm64-v8a/libvibecoder_node_exec.so
            android/app/build/outputs/vibecoder-part34-node-cross-build-evidence.json
            android/app/build/outputs/vibecoder-part34-node-configure.log
            android/app/build/outputs/vibecoder-part34-node-make.log
          if-no-files-found: error
          retention-days: 90
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: vibecoder-node-24.19.0-failure-logs
          path: android/app/build/outputs/vibecoder-part34-node-*.log
          if-no-files-found: warn
          retention-days: 90
