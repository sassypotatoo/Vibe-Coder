name: Android Play bundle with on-demand Node

on:
  workflow_dispatch:
    inputs:
      node_runtime_run_id:
        description: Successful "Node Android runtime proof" workflow run ID for Node 24.19.0
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  ANDROID_PLATFORM: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK_VERSION: "28.2.13676358"
  ANDROID_CMAKE_VERSION: "3.22.1"
  VIBECODER_ANDROID_API: "29"

jobs:
  play-bundle:
    name: Play AAB (base + on-demand Node)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - uses: android-actions/setup-android@v4.0.1
        with:
          cmdline-tools-version: "15859902"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Android packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: aarch64-linux-android

      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: "9.5.0"
          cache-provider: basic

      - name: Download previously proven Node runtime
        uses: actions/download-artifact@v8.0.1
        with:
          name: vibecoder-node-24.19.0-android-arm64
          path: ${{ runner.temp }}/node-runtime
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.node_runtime_run_id }}

      - name: Fetch and cross-compile exact Jcode source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/fetch_jcode_android_source.sh "${RUNNER_TEMP}/jcode-v0.73.0"
          export ANDROID_NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          export VIBECODER_JCODE_TARGET_DIR="${RUNNER_TEMP}/jcode-target"
          bash scripts/build_jcode_android.sh "${RUNNER_TEMP}/jcode-v0.73.0"

      - name: Stage Jcode and bind build evidence
        shell: bash
        run: |
          set -euo pipefail
          DEST="android/app/build/generated/jniLibs/arm64-v8a"
          mkdir -p "$DEST" android/app/build/outputs
          JCODE="$DEST/libvibecoder_jcode_exec.so"
          test -s "$JCODE"
          python3 scripts/verify_android_elf.py "$JCODE" >/dev/null
          # The established Part 31 evidence writer is produced by the same verified package lane.
          bash scripts/part31_build_and_verify.sh jcode
          cp android/app/build/outputs/vibecoder-part31-build-evidence.json \
             android/app/build/outputs/vibecoder-part34-jcode-build-evidence.json

      - name: Reproduce exact reviewed OmniRoute archive
        shell: bash
        run: bash scripts/fetch_omniroute_reviewed_archive.sh "${RUNNER_TEMP}/OmniRoute-release-v3.8.50.zip"

      - name: Validate source and build Play bundle
        shell: bash
        run: |
          set -euo pipefail
          NODE="$(find "${RUNNER_TEMP}/node-runtime" -type f -name libvibecoder_node_exec.so -print -quit)"
          NODE_EVIDENCE="$(find "${RUNNER_TEMP}/node-runtime" -type f -name vibecoder-part34-node-cross-build-evidence.json -print -quit)"
          test -n "$NODE" -a -s "$NODE"
          test -n "$NODE_EVIDENCE" -a -s "$NODE_EVIDENCE"
          python3 scripts/validate_checkpoint.py
          python3 scripts/test_part34_3_android_stub_compat.py
          python3 scripts/test_part34_3_live_build_logging.py
          python3 scripts/validate_part34_10.py
          python3 scripts/test_part34_10_ui_tools.py
          python3 scripts/test_part34_10_alpha_package_tools.py
          python3 scripts/test_part34_10_compile_repairs.py
          bash scripts/part34_10_strict_java_compile.sh
          export ANDROID_NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          bash scripts/part34_play_bundle_build_and_verify.sh \
            "${RUNNER_TEMP}/OmniRoute-release-v3.8.50.zip" "$NODE" "$NODE_EVIDENCE"

      - name: Upload Play build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: vibecoder-part34-play-failure-diagnostics
          path: |
            android/app/build/outputs/vibecoder-part34-omniroute-build.log
            android/app/build/outputs/vibecoder-part34-omniroute-bundle-evidence.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Play bundle + package evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: vibecoder-part34-play-aab
          path: |
            android/app/build/outputs/bundle/debug/app-debug.aab
            android/app/build/outputs/vibecoder-part34-play-bundle-evidence.json
            android/app/build/outputs/vibecoder-part34-jcode-build-evidence.json
            android/app/build/outputs/vibecoder-part34-omniroute-bundle-evidence.json
            android/app/build/outputs/vibecoder-part34-omniroute-build.log
            android/app/build/outputs/vibecoder-part34-omniroute-asset-staging.json
          if-no-files-found: error
          retention-days: 14
