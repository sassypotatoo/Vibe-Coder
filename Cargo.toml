[workspace]
resolver = "2"
exclude = ["third_party/jcode/crates/jcode-harness-api", "third_party/jcode/crates/jcode-sdk"]
members = [
    "crates/vibecoder-domain",
    "crates/vibecoder-agent-contract",
    "crates/vibecoder-agent-jcode",
    "crates/vibecoder-gateway-contract",
    "crates/vibecoder-gateway-omniroute",
    "crates/vibecoder-routing",
    "crates/vibecoder-secrets",
    "crates/vibecoder-config",
    "crates/vibecoder-command-policy",
    "crates/vibecoder-process-contract",
    "crates/vibecoder-process-local",
    "crates/vibecoder-android-host",
    "crates/vibecoder-runtime-packaging",
    "crates/vibecoder-persistence-contract",
    "crates/vibecoder-persistence-local",
    "crates/vibecoder-checkpoint-contract",
    "crates/vibecoder-checkpoint-local",
    "crates/vibecoder-build-contract",
    "crates/vibecoder-web-toolchain",
    "crates/vibecoder-web-build-pipeline",
    "crates/vibecoder-build-repair",
    "crates/vibecoder-build-loop",
    "crates/vibecoder-task-orchestration",
    "crates/vibecoder-workspace-contract",
    "crates/vibecoder-workspace-local",
    "crates/vibecoder-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
async-trait = "0.1"
futures-channel = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
url = "2"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"
sha2 = "0.10"
